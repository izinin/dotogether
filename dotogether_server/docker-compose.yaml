services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dotogether
      POSTGRES_PASSWORD: "_KDlyITdf-Vdn15AckIA2i7ED_3y4r-l"
    volumes:
      - dotogether_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Ut4Wlh9gxogOkUpHvPQAoeuXKqvQKcJ2"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dotogether_test
      POSTGRES_PASSWORD: "cO4KUJBt6inKgbKlj2V6NpOBjmQ8bSIM"
    volumes:
      - dotogether_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "ItivgNIbvrU9QsgW1D0Ssc0rCiZe7heW"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  dotogether_data:
  dotogether_test_data:
