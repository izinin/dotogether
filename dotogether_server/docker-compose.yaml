services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dotogether
      POSTGRES_PASSWORD: "QpTSXGvQj3YgK0T5K_iX0qK-8o4H149x"
    volumes:
      - dotogether_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "bJpWzLr5OsNQDi-8449kD9yMoEvCyH-f"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dotogether_test
      POSTGRES_PASSWORD: "wbvbzyAlejDowHbRTblh7EnxeYt6aXOJ"
    volumes:
      - dotogether_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "x0JzBh-ZB8ai2OR4sY9h-_1caiHp-RKK"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  dotogether_data:
  dotogether_test_data:
