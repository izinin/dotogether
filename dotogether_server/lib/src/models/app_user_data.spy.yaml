class: AppUserData
table: app_user_data
fields:
  ### The AuthUser this extra profile info belongs to
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  ### Phone number for SMS and task identification
  phoneNumber: String?
  ### Device push notification token (FCM/APNS)
  deviceToken: String?
  ### Timestamp when this profile was created
  createdAt: DateTime, default=now
  ### Timestamp when this profile was last updated
  updatedAt: DateTime, default=now

indexes:
  app_user_data_auth_user_idx:
    fields: authUserId
    unique: true
  app_user_data_phone_idx:
    fields: phoneNumber
