class: Project
table: project
fields:
  ### Title of the project or collaborative task
  title: String
  ### Detailed notes or description
  description: String, default=''
  ### Contact record representing the project creator / Task Owner
  owner: Contact?, relation
  ### Contact record representing the Task Assignee/Executor
  assignee: Contact?, relation
  ### Overall progress status: 'pending', 'in_progress', 'completed'
  overallStatus: String, default='pending'
  ### When the project was created
  createdAt: DateTime, default=now
  ### Interactive checklist items
  checklistItems: List<ChecklistItem>?, relation(name=project_checklist_items)

indexes:
  project_owner_id_idx:
    fields: ownerId
  project_assignee_id_idx:
    fields: assigneeId
